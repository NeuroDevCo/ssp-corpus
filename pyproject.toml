[project]
name = "ssp-corpus"
version = "0.1.0"
description = "A phonological corpus analysis on the prevalence of the Sonority Sequencing Principle across languages."
readme = "README.md"
requires-python = ">=3.12.7"
dependencies = [
    "arviz>=1.2.0",
    "great-tables>=0.22.0",
    "h5netcdf>=1.8.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "netcdf4>=1.7.5.1.post1",
    "numpy==2.3.5",
    "panphon>=0.22.2",
    "polars>=1.38.1",
    "pyarrow>=23.0.1",
    "pymc>=6.2.0",
    "python-iso639>=2026.1.31",
    "quarto>=0.1.0",
    "rich>=14.3.3",
    "ty>=0.0.29",
    "wikipron>=1.3.3",
    "wordfreq[cjk]>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.6",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = [".", "src"]


[tool.uv.build-backend]
module-root = ""
module-name = "src"

[tool.ty.rules]
invalid-attribute-override = "ignore"
