[project]
name = "ssp-corpus"
version = "0.1.0"
description = "A phonological corpus analysis on the prevalence of the Sonority Sequencing Principle across languages."
readme = "README.md"
requires-python = ">=3.12.7"
dependencies = [
    "arviz>=0.23.4",
    "arviz-stats>=1.0.0",
    "basemap==2.0.0",
    "cmdstanpy>=1.3.0",
    "great-tables>=0.21.0",
    "h5netcdf>=1.8.1",
    "kulprit>=0.5.1",
    "langcodes>=3.5.1",
    "language-data>=1.4.0",
    "lingtypology>=0.8.6",
    "matplotlib>=3.10.8",
    "netcdf4>=1.7.4",
    "numpy==2.3.5",
    "panphon>=0.22.2",
    "polars>=1.38.1",
    "pyarrow>=23.0.1",
    "pytest>=9.0.2",
    "python-iso639>=2026.1.31",
    "rich>=14.3.3",
    "scipy>=1.17.1",
    "wikipron>=1.3.3",
    "wordfreq[cjk]>=3.1.1",
]

[dependency-groups]
dev = ["ruff>=0.15.6"]
