title: Syllable token frequencies reveal a high cross-linguistic prevalence of the Sonority Sequencing Principle
shorttitle: Syllabic frequency and Sonority Sequencing Principle
keywords: [sonority, syllable, language acquisition, phonology, bayesian]

abstract: Sonority is a ponological feature of phonemes that describes the relative salience of individual phonemes, often represented in a numeric scale. The Sonority Sequencing Principle (SSP) is a phonotactical rule that constrains the order of the phonemes inside a syllable. According to this principle, in well-formed syllables sonority increases from the onset toward the nucleus, and decrease toward the coda. Experimental evidence suggests that the SSP modulates speech processing from the earliest stages of language acquisition, when SSP-following syllables are preferred. Whether such a preference is reflected in a higher prevalence of SSP-following structures in natural speech across languages is relatively unknown. To address this issue, we gathered a large dataset of 43,229 syllables from 67 languages (13 macro-families), and used multilevel Bayesian modelling to yield an estimate of SSP compliance across languages. To better reflect the rate of occurrence of SSP-following and SSP-violating syllables in natural speech, we adjusted the model estimates using a measure of syllabic frequency, predicting a positive correlation between the frequency of syllables and their compliance with the SSP. We found an overall estimate of SSP compliance of 98.7%, with only 11.94% of languages following the SSP less than 90% of the time. SSP-following syllables were, on average, more frequent than SSP-violating syllables. Our findings suggest that syllables that follow the SSP are strongly preferered acrosss languages, and that the SSP is a cross-linguistically available contraint to syllabic structure, reflecting speakers' preferences for such structures in speech processing.

