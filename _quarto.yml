title: Syllable token frequencies reveal a high cross-linguistic prevalence of the Sonority Sequencing Principle
shorttitle: Syllabic frequency and Sonority Sequencing Principle
keywords: [sonority, syllable, language acquisition, phonology, bayesian model]

abstract: The Sonority Sequencing Principle (SSP) is a phonotactic rule that constrains the order of phonemes inside a syllable based on their perceptual salience (sonority). According to the SSP, sonority increases from onset to nucleus and decreases toward coda in well-formed syllables, whereas ill-formed syllables show a drop of sonority before the nucleus. Experimental evidence points to a preference for sonority-compliant syllables, even with materials not attested in the speakers’ language or with very limited language experience (newborns), suggesting that the SSP modulates speech processing from the earliest stages of language acquisition. The SSP has been proposed as a linguistic universal with which humans may be equipped from birth, but the extent well-formed (SSP-following) syllables are actually more common than ill-formed ones across languages is unclear. We addressed this issue by quantifying the prevalence of the SSP in a large dataset of 34,878 syllables from 65 languages (13 macro-families), using syllabified phonological transcriptions while also accounting for how often syllables are uttered in natural speech. Results revealed that SSP-following syllables are, on average, significantly more frequent than SSP-violating ones across languages, with an overall cross-linguistic conformity of 98.79%. In addition, the majority of languages in our sample followed the SSP more than 90% of the time. Our findings suggest that syllables that follow the SSP are strongly preferred across languages, and that the SSP is a cross-linguistically available constraint on syllabic structure. Notably, the syllabic structures most prevalent across languages are also those that learners prefer from the earliest stages of development, consistent with the view that the structure of natural languages reflects the learning mechanisms humans bring to language acquisition.

