title: Syllable token frequencies reveal a high cross-linguistic prevalence of the Sonority Sequencing Principle
shorttitle: Syllabic frequency and Sonority Sequencing Principle
keywords: [sonority, syllable, language acquisition, phonology, bayesian model]

abstract: The Sonority Sequencing Principle (SSP) is a phonotactic rule that constrains the order of phonemes inside a syllable based on their perceptual salience (sonority). According to the SSP, sonority increases from onset to nucleus and decreases toward the coda in well-formed syllables, whereas ill-formed syllables show a drop in sonority before the nucleus. Experimental evidence points to a preference for sonority-compliant syllables, even with materials not attested in the speakers' language or with very limited language experience (newborns), suggesting that the SSP modulates speech processing from early ages. The SSP is considered a linguistic universal that humans may be equipped with from birth, but whether SSP-following syllables are actually more common than ill-formed ones across languages is unclear. We addressed this issue by quantifying the prevalence of the SSP in a dataset of 34,878 syllables from 65 languages (13 macro-families), using syllabified phonological transcriptions while accounting for how often syllables are uttered in natural speech. SSP-following syllables were, on average, significantly more frequent than SSP-violating ones across languages, with an overall cross-linguistic conformity of 98.02%; most languages in our sample followed the SSP more than 90% of the time. Our findings suggest that SSP-following syllables are strongly preferred across languages and that the SSP is a cross-linguistically available constraint on syllabic structure. Notably, the syllabic structures most prevalent across languages are also preferred by learners from the earliest stages of development, consistent with the view that the structure of natural languages reflects the learning mechanisms humans bring to language acquisition.

